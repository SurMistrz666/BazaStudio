[workspace]
members = ["crates/baza-core", "crates/baza-qa", "crates/baza-studio"]
exclude = ["vendor/sqlx-postgres", "vendor/sqlx-mysql"]
resolver = "3"

[patch.crates-io]
sqlx-postgres = { path = "vendor/sqlx-postgres" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }

[workspace.package]
version = "0.4.0-preview.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui_extras = { version = "=0.36.2", features = ["serde"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "mysql-rsa", "sqlite", "chrono", "json", "bigdecimal", "uuid"] }
bigdecimal = { version = "0.4", features = ["serde"] }
russh = "=0.64.1"
aes-gcm = "=0.11.1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
sha2 = "0.11"
sha1 = "=0.11.0"
hmac = "=0.13.0"
subtle = "2.6"
base64 = "0.22"
argon2 = "0.5"
scrypt = "=0.12.0"
dirs = "6"
rfd = "=0.17.2"
csv = "1"
quick-xml = { version = "0.39", features = ["serialize"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "=0.14.1", default-features = false }
tempfile = "3"
winresource = { version = "0.1.31", default-features = false }
# SQL Server over TDS. Its rustls feature turns on `tokio-util/compat`, which the driver uses to hand it a Tokio socket.
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "tds80", "rustls", "rustls-webpki-roots"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
# DuckDB, an embedded engine, with its library compiled in. `json` and `parquet` are the readers of those files.
duckdb = { version = "=1.10506.0", default-features = false, features = ["bundled", "json", "parquet"] }
# Apache Cassandra and ScyllaDB over the CQL native protocol.
scylla = { version = "=1.9.0", default-features = false, features = ["rustls-023"] }
# Oracle Database over Oracle Net (TNS/TTC): the thin client maintained by Oracle, which needs no Oracle client libraries.
oracledb = "=26.0.0-beta.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

